[package]
name = "fileflow-desktop"
version = "0.2.0-rc.1"
edition = "2024"
rust-version = "1.99"
publish = false

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
tauri = { version = "=2.12.1", features = [] }
serde = { version = "=1.0.228", features = ["derive"] }
uuid = { version = "=1.23.1", features = ["v4"] }
webview2-com = "=0.39.1"
windows = { version = "=0.62.2", features = ["Storage", "Storage_Provider", "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Memory", "Media_Ocr", "Globalization", "Graphics_Imaging", "Storage_Streams", "Foundation_Collections", "Win32_System_WinRT"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
